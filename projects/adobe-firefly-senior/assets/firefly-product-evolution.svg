<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 280" fill="none" role="img" aria-label="Firefly product evolution timeline from 2023 to 2025">
  <rect width="1200" height="280" fill="#F7F7F5"/>
  <line x1="80" y1="140" x2="1120" y2="140" stroke="#D8D8D4" stroke-width="1"/>
  <circle cx="200" cy="140" r="6" fill="#1A1A1A"/>
  <circle cx="600" cy="140" r="6" fill="#1A1A1A"/>
  <circle cx="1000" cy="140" r="6" fill="#1473E6"/>
  <text x="200" y="100" text-anchor="middle" fill="#1A1A1A" font-family="Inter, sans-serif" font-size="18" font-weight="500">2023</text>
  <text x="200" y="125" text-anchor="middle" fill="#8A8A8A" font-family="Inter, sans-serif" font-size="11" font-weight="500" letter-spacing="1.2">GENERATE</text>
  <text x="200" y="185" text-anchor="middle" fill="#5C5C5C" font-family="Inter, sans-serif" font-size="14">Text to Image</text>
  <text x="200" y="205" text-anchor="middle" fill="#5C5C5C" font-family="Inter, sans-serif" font-size="14">Generative Fill</text>
  <text x="600" y="100" text-anchor="middle" fill="#1A1A1A" font-family="Inter, sans-serif" font-size="18" font-weight="500">2024</text>
  <text x="600" y="125" text-anchor="middle" fill="#8A8A8A" font-family="Inter, sans-serif" font-size="11" font-weight="500" letter-spacing="1.2">MORE CONTROL</text>
  <text x="600" y="185" text-anchor="middle" fill="#5C5C5C" font-family="Inter, sans-serif" font-size="14">Structure Reference</text>
  <text x="600" y="205" text-anchor="middle" fill="#5C5C5C" font-family="Inter, sans-serif" font-size="14">Generative Expand</text>
  <text x="600" y="225" text-anchor="middle" fill="#5C5C5C" font-family="Inter, sans-serif" font-size="14">Video beta</text>
  <text x="1000" y="100" text-anchor="middle" fill="#1A1A1A" font-family="Inter, sans-serif" font-size="18" font-weight="500">2025+</text>
  <text x="1000" y="125" text-anchor="middle" fill="#8A8A8A" font-family="Inter, sans-serif" font-size="11" font-weight="500" letter-spacing="1.2">MULTI-MODAL</text>
  <text x="1000" y="185" text-anchor="middle" fill="#5C5C5C" font-family="Inter, sans-serif" font-size="14">Image · Video · Boards</text>
  <text x="1000" y="205" text-anchor="middle" fill="#5C5C5C" font-family="Inter, sans-serif" font-size="14">Audio · Partner models</text>
</svg>
